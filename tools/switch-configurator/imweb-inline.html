<!-- ══════════════════════════════════════════════════════════════
     칸트라이팅 스위치 구성기 — 아임웹 '코드 섹션' 직접 붙여넣기용
     · iframe 없이 이 블록 전체를 코드 섹션에 그대로 붙이면 됩니다.
     · 모든 스타일은 #kantsw 안으로만 적용되어 사이트 테마를 건드리지 않습니다.
     · 스크립트는 전부 함수 안에 갇혀 있어 사이트 JS와 충돌하지 않습니다.
     ══════════════════════════════════════════════════════════════ -->
<style id="kantsw-style">
/* ── 사이트 CSS 차단막: 툴 안의 모든 요소를 브라우저 기본값으로 되돌린 뒤
      아래 규칙만 적용된다 (#kantsw 스코프라 사이트에는 영향 없음) ── */
#kantsw,#kantsw-pop,#kantsw *:not(svg):not(svg *),#kantsw-pop *:not(svg):not(svg *),#kantsw *::before,#kantsw *::after,#kantsw-pop *::before,#kantsw-pop *::after{all:revert}
/* ══ 설정 ═══════════════════════════════════════════════
   아임웹 상단 메뉴가 '고정(sticky)' 이면 그 높이를 --kant-top 에 넣으세요.
   예) 헤더 높이가 70px 이면  --kant-top:70px;
   ══════════════════════════════════════════════════════ */
#kantsw,#kantsw-pop{--kant-top:0px}

function plateSpecOf(type,bid){
 var b=brandById(bid||(BRAND&&BRAND.id)); if(!b||!b.plates)return null;
 var t=KTYPE[type]; var cols=(t&&t.cols&&t.cols.length)||1;
 return b.plates[cols>1?2:1]||b.plates[1];
}
function plateTally(mods,bid){
 var m={}, P=dataOf(bid); if(!P)return [];
 (mods||[]).forEach(function(nm){
  if(!nm||nm===SPAN)return;
  var f=P.prices[(BRAND&&state.color)||'']||null;
  var ty=null;
  for(var ck in P.prices){var ff=P.prices[ck].functions.find(function(x){return x.name===nm;}); if(ff){ty=ff.type;break;}}
  var sp=plateSpecOf(ty,bid); if(!sp)return;
  m[sp]=(m[sp]||0)+1;
 });
 return Object.keys(m).map(function(k){return k+' ×'+m[k];});
}

function applyPriceSet(pr,wb){
 BRANDS.filter(function(b){return b.data;}).forEach(function(b){
  var P=(pr&&pr[b.id])||pr, W=(wb&&wb[b.id])||wb;
  if(P){ for(var ck in b.data.prices){ var s=P[ck]; if(!s)continue;
   if(s.frame) b.data.prices[ck].frame=s.frame;
   b.data.prices[ck].functions.forEach(function(f){ if(s.fp&&s.fp[f.name]!=null) f.price=s.fp[f.name]; });
   /* 그 색상에 없는 품목은 목록에서 제외 */
   if(b.pruneZero) b.data.prices[ck].functions=b.data.prices[ck].functions.filter(function(f){return f.price>0;});
  } }
  if(W){ b.data.wallbox.forEach(function(w){ if(W[w.id]!=null) w.price=W[w.id]; }); }
 });
}

function shadeHex(hex,amt){

 if(c.length===3)c=c.split('').map(function(x){return x+x;}).join('');
 var r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);

function kMark(cx,cy,s,mk,col){
 if(mk==='3way') return '<path d="M'+(cx-s*.9)+' '+(cy)+' h'+(s*1.8)+' M'+(cx+s*.4)+' '+(cy-s*.5)+' l'+(s*.5)+' '+(s*.5)+' l'+(-s*.5)+' '+(s*.5)+'" fill="none" stroke="'+col+'" stroke-width="'+(s*.28)+'" stroke-linecap="round" stroke-linejoin="round"/>';
 if(mk==='fan') return '<g stroke="'+col+'" stroke-width="'+(s*.24)+'" fill="none" stroke-linecap="round">'
   +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.22)+'" fill="'+col+'" stroke="none"/>'
   +'<path d="M'+cx+' '+cy+' q'+(s*1.1)+' '+(-s*.2)+' '+(s*.8)+' '+(-s*.95)+'"/>'
   +'<path d="M'+cx+' '+cy+' q'+(-s*.2)+' '+(s*1.1)+' '+(-s*.95)+' '+(s*.8)+'"/>'
   +'<path d="M'+cx+' '+cy+' q'+(-s*1.1)+' '+(-s*.2)+' '+(-s*.8)+' '+(-s*.95)+'"/></g>';
 if(mk==='alloff') return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.72)+'" fill="none" stroke="'+col+'" stroke-width="'+(s*.24)+'"/>'
   +'<line x1="'+cx+'" y1="'+(cy-s*.95)+'" x2="'+cx+'" y2="'+(cy-s*.1)+'" stroke="'+col+'" stroke-width="'+(s*.26)+'" stroke-linecap="round"/>';
 if(mk==='mix') return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.24)+'" fill="'+col+'"/>';
 if(mk==='updown') return '<path d="M'+(cx-s*.5)+' '+(cy-s*.18)+' l'+(s*.5)+' '+(-s*.42)+' l'+(s*.5)+' '+(s*.42)+'" fill="none" stroke="'+col+'" stroke-width="'+(s*.22)+'" stroke-linecap="round" stroke-linejoin="round"/>'
   +'<path d="M'+(cx-s*.5)+' '+(cy+s*.18)+' l'+(s*.5)+' '+(s*.42)+' l'+(s*.5)+' '+(-s*.42)+'" fill="none" stroke="'+col+'" stroke-width="'+(s*.22)+'" stroke-linecap="round" stroke-linejoin="round"/>';
 return '';
}
function kFace(kind,x,y,w,h,recess,edge,dark2){
 var cx=x+w/2, cy=y+h/2, s=Math.min(w,h);
 switch(kind){
  case 'socket':      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.38)+'" fill="'+recess+'" stroke="'+edge+'" stroke-width=".9"/>'
    +'<circle cx="'+(cx-s*.15)+'" cy="'+cy+'" r="'+(s*.07)+'" fill="'+dark2+'"/><circle cx="'+(cx+s*.15)+'" cy="'+cy+'" r="'+(s*.07)+'" fill="'+dark2+'"/>';
  case 'socketV':     return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.38)+'" fill="'+recess+'" stroke="'+edge+'" stroke-width=".9"/>'
    +'<circle cx="'+cx+'" cy="'+(cy-s*.15)+'" r="'+(s*.07)+'" fill="'+dark2+'"/><circle cx="'+cx+'" cy="'+(cy+s*.15)+'" r="'+(s*.07)+'" fill="'+dark2+'"/>';
  case 'socketCover': return kFace('socket',x,y,w,h,recess,edge,dark2)
    +'<rect x="'+(x+w*.12)+'" y="'+(y+h*.1)+'" width="'+(w*.76)+'" height="'+(h*.8)+'" rx="'+(s*.09)+'" fill="none" stroke="'+edge+'" stroke-width=".9"/>';
  case 'socketSwitch':return kFace('socket',x,y,w*.62,h,recess,edge,dark2)
    +'<rect x="'+(x+w*.68)+'" y="'+(y+h*.24)+'" width="'+(w*.24)+'" height="'+(h*.52)+'" rx="1" fill="'+recess+'" stroke="'+edge+'" stroke-width=".9"/>';
  case 'socketUsb':   return kFace('socket',x,y,w*.62,h,recess,edge,dark2)
    +'<rect x="'+(x+w*.68)+'" y="'+(y+h*.4)+'" width="'+(w*.24)+'" height="'+(h*.2)+'" rx="'+(h*.09)+'" fill="'+recess+'" stroke="'+edge+'" stroke-width=".9"/>';
  case 'rj':          return '<rect x="'+(cx-s*.24)+'" y="'+(cy-s*.2)+'" width="'+(s*.48)+'" height="'+(s*.4)+'" rx="1.2" fill="'+recess+'" stroke="'+edge+'" stroke-width=".9"/>'
    +'<rect x="'+(cx-s*.09)+'" y="'+(cy+s*.16)+'" width="'+(s*.18)+'" height="'+(s*.12)+'" rx="1" fill="'+recess+'" stroke="'+edge+'" stroke-width=".8"/>';
  case 'coax':        return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.24)+'" fill="'+recess+'" stroke="'+edge+'" stroke-width=".9"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.07)+'" fill="'+dark2+'"/>';
  case 'coaxRj':      return kFace('rj',x,y,w*.5,h,recess,edge,dark2)+kFace('coax',x+w*.5,y,w*.5,h,recess,edge,dark2);
  case 'coaxRj2':     return kFace('rj',x,y,w*.5,h,recess,edge,dark2)+kFace('coax',x+w*.5,y,w*.5,h,recess,edge,dark2);
  case 'speaker':     return '<rect x="'+(cx-s*.26)+'" y="'+(cy-s*.16)+'" width="'+(s*.52)+'" height="'+(s*.32)+'" rx="1.5" fill="'+recess+'" stroke="'+edge+'" stroke-width=".9"/>'
    +'<rect x="'+(cx-s*.2)+'" y="'+(cy-s*.09)+'" width="'+(s*.16)+'" height="'+(s*.18)+'" fill="#c0392b"/>'
    +'<rect x="'+(cx+s*.04)+'" y="'+(cy-s*.09)+'" width="'+(s*.16)+'" height="'+(s*.18)+'" fill="#2b2b2b"/>';
  case 'banana2':     return '<circle cx="'+(cx-s*.14)+'" cy="'+cy+'" r="'+(s*.09)+'" fill="#c9a24a" stroke="'+edge+'" stroke-width=".7"/>'
    +'<circle cx="'+(cx+s*.14)+'" cy="'+cy+'" r="'+(s*.09)+'" fill="#c9a24a" stroke="'+edge+'" stroke-width=".7"/>';
  case 'banana4':     return kFace('banana2',x,y,w,h*.5,recess,edge,dark2)+kFace('banana2',x,y+h*.5,w,h*.5,recess,edge,dark2);
  case 'dimmer':      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.34)+'" fill="'+recess+'" stroke="'+edge+'" stroke-width="1"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.24)+'" fill="none" stroke="'+edge+'" stroke-width=".8"/>'
    +'<line x1="'+cx+'" y1="'+(cy-s*.3)+'" x2="'+cx+'" y2="'+(cy-s*.14)+'" stroke="'+dark2+'" stroke-width="1.4" stroke-linecap="round"/>';
  default: return '';
 }
}

function stbHeadSVG(recess,edge,dark2){
 return '<circle cx="50" cy="50" r="23" fill="'+recess+'" stroke="'+edge+'" stroke-width="1.3"/>'

  +'<line x1="50" y1="34" x2="50" y2="42.5" stroke="'+edge+'" stroke-width="2" stroke-linecap="round"/>'
  +'<rect x="31.5" y="55" width="7" height="9.5" rx="1.6" fill="'+dark2+'"/>'
  +'<rect x="61.5" y="55" width="7" height="9.5" rx="1.6" fill="#c0392b"/>'
  +'<circle cx="50" cy="61" r="2.6" fill="#2e9e5b"/>';
}
/* 국내형 모듈 한 칸 그리기 (100x100 좌표) */
function koreanFace(type,hex,dark,knob){
 var t=KTYPE[type]; if(!t)return '';
 var khex=(knob&&knob.hex)||hex, kdark=(knob&&knob.hex)?!!knob.dark:dark;
 var edge=kdark?'rgba(255,255,255,.34)':'rgba(0,0,0,.22)';
 var line=dark?'rgba(0,0,0,.55)':'rgba(0,0,0,.30)';
 var recess=shadeHex(khex,kdark?-0.18:-0.12);
 var dark2=kdark?'#0b0b0b':'#3a3a3a';
 var mkc=kdark?'rgba(255,255,255,.55)':'rgba(0,0,0,.42)';
 var face=shadeHex(khex,kdark?0.06:0.035);
 var cols=t.cols||[]; if(!cols.length) return '';
 var cols0=cols.length;
 /* 실측 기하: 플레이트 대비 노브 블록 — 1열 폭 50%, 2열 폭 43%×2, 행 높이 18.07%, 중심 y 49.75% */
 var isE=(t.box===EBOX_REF);
 var B=t.box||KBOX;
 var UW, UH, CY;
 if(isE){ UW=B.w/(t.gc||1); UH=B.h/(t.gr||2); CY=50; }
 else {
  /* 실측: 모듈 열 폭 = 플레이트 높이의 35.9%, 행 높이 = 18.07% */
  UW=(0.359*KCELL.H)/(KCELL.slotW/100);   /* 셀(0~100) 좌표계로 환산 */
  UW=Math.min(UW, 92/cols0);               /* 셀을 넘지 않게 */
  UH=18.07; CY=49.75;
 }
 var colSum=cols.map(function(c){return c.reduce(function(a,v){return a+v;},0);});
 var maxRows=Math.max.apply(null,colSum);
 var GR=(t.gr||3);
 var rowsUsed=Math.min(Math.max(maxRows,1),GR);
 var bw=cols.length*UW, bh=rowsUsed*UH;
 var bx=50-bw/2, by=CY-bh/2;
 var g='';
 /* 노브(로커)는 열 단위로 한 덩어리 — 구 사이는 슬릿(가는 선)만 있고 서로 붙어 있다 */
 var colGap=1.6;
 cols.forEach(function(col,ci){
  var n=col.length; if(!n)return;
  var tot=colSum[ci];
  var cx0=bx+ci*UW+colGap, cw2=UW-colGap*2, colH=bh*(tot/rowsUsed), cy0=by+(bh-colH)/2;
  var rx=t.round?Math.min(cw2,colH)*0.5:2;
  if(t.round){
   /* 원형: 오벌 둘레의 크롬 링 */
   g+='<rect x="'+(cx0-2.2)+'" y="'+(cy0-2.2)+'" width="'+(cw2+4.4)+'" height="'+(colH+4.4)+'" rx="'+(rx+2.2)+'" fill="none" stroke="'+shadeHex(khex,0.34)+'" stroke-width="2.6"/>'
     +'<rect x="'+(cx0-2.2)+'" y="'+(cy0-2.2)+'" width="'+(cw2+4.4)+'" height="'+(colH+4.4)+'" rx="'+(rx+2.2)+'" fill="none" stroke="'+line+'" stroke-width="0.9"/>';
  }
  /* 노브 덩어리 */
  g+='<rect x="'+cx0+'" y="'+cy0+'" width="'+cw2+'" height="'+colH+'" rx="'+rx+'" fill="'+face+'" stroke="'+line+'" stroke-width="1.3"/>';
  /* 상단 하이라이트 · 하단 음영 */
  g+='<rect x="'+(cx0+1.4)+'" y="'+(cy0+1.2)+'" width="'+(cw2-2.8)+'" height="'+(colH*0.42)+'" rx="'+Math.max(0,rx-1.4)+'" fill="'+shadeHex(khex,kdark?0.10:0.07)+'" opacity=".55"/>';
  /* 구 사이 슬릿 */
  var ins=t.round?cw2*0.06:1.6;
  var acc=0;
  for(var ri=1;ri<n;ri++){
   acc+=col[ri-1];
   var y=cy0+colH*(acc/tot);
   g+='<line x1="'+(cx0+ins)+'" y1="'+(y-0.5)+'" x2="'+(cx0+cw2-ins)+'" y2="'+(y-0.5)+'" stroke="'+line+'" stroke-width="1.5"/>'
     +'<line x1="'+(cx0+ins)+'" y1="'+(y+0.9)+'" x2="'+(cx0+cw2-ins)+'" y2="'+(y+0.9)+'" stroke="'+shadeHex(khex,kdark?0.14:0.11)+'" stroke-width="0.9" opacity=".9"/>';
  }
  /* 기능 그래픽 / 각인 */
  var acc2=0;
  for(var r2=0;r2<n;r2++){
   var hh=colH*(col[r2]/tot), yy=cy0+colH*(acc2/tot); acc2+=col[r2];
   if(t.face) g+=kFace(t.face,cx0,yy,cw2,hh,recess,edge,dark2);
   else if(t.mark && (r2===0&&ci===0 || t.mark==='updown')) g+=kMark(cx0+cw2/2,yy+hh/2,Math.min(cw2,hh)*0.32,t.mark,mkc);
  }
 });
 return g;
}


/* ============================================================
   JUNG LS990 — 플랫 디자인 벡터
   셀 = 피치 70mm × 프레임 높이 81mm (0~100 좌표계)
   기능부(로커/소켓 커버) = 65 × 65 mm → 92.8 × 80.2 (%)
   ============================================================ */
const JB={x:0,y:0,w:100,h:100};   /* 커버 영역 = 셀 전체 (테두리는 previewFrameSVG가 그림) */
function jPlate(){return '';}
function jIn(inner){ return arFix(inner); }
function jSplit(n,soft){
 var g='';
 for(var i=1;i<n;i++){var x=JB.x+JB.w*i/n;
  g+='<line x1="'+x+'" y1="'+(JB.y+1.2)+'" x2="'+x+'" y2="'+(JB.y+JB.h-1.2)+'" stroke="'+soft+'" stroke-width="1.15"/>';}
 return g;
}
function jUsbPort(cx,cy,w,recess,edge,dark2){

 return '<rect x="'+(cx-w/2)+'" y="'+(cy-h/2)+'" width="'+w+'" height="'+h+'" rx="'+(h*0.28)+'" fill="'+dark2+'" opacity=".9"/>'
  +'<rect x="'+(cx-w*0.32)+'" y="'+(cy-h*0.12)+'" width="'+(w*0.64)+'" height="'+(h*0.26)+'" rx="'+(h*0.1)+'" fill="'+recess+'"/>';
}

/* 방우형 커버 — 위쪽 힌지에서 반쯤 열린 상태 (모듈 안쪽에만 그린다) */
function jFlap(hex,dark,edge,soft){
 var f1=shadeHex(hex,dark?0.17:0.10), f2=shadeHex(hex,dark?0.04:0.01);
 var gid='f'+Math.random().toString(36).slice(2,7);
 return '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
  +'<stop offset="0" stop-color="'+f2+'"/><stop offset="1" stop-color="'+f1+'"/></linearGradient></defs>'
  +'<path d="M16 33 L84 33 L81 39 L19 39 Z" fill="rgba(0,0,0,'+(dark?'.34':'.12')+')"/>'
  +'<path d="M23 11 L77 11 L86 33 L14 33 Z" fill="url(#'+gid+')" stroke="'+edge+'" stroke-width="1.4" stroke-linejoin="round"/>'
  +'<path d="M25 16 L75 16" stroke="'+soft+'" stroke-width="0.9"/>'
  +'<rect x="21" y="8.5" width="58" height="4" rx="2" fill="'+shadeHex(hex,dark?-0.26:-0.17)+'"/>';
}
/* 중심 기준 확대 — 융은 커버가 커서 잭/소켓을 키워야 실물 비율이 맞는다 */
function jBig(inner,k){return '<g transform="translate(50,50) scale('+k+') translate(-50,-50)">'+inner+'</g>';}
function jungFace(type,hex,dark){
 var edge=dark?'rgba(255,255,255,.30)':'rgba(0,0,0,.22)';
 var soft=dark?'rgba(0,0,0,.45)':'rgba(0,0,0,.16)';
 var recess=shadeHex(hex,dark?-0.20:-0.13);
 var dark2=dark?'#0b0b0b':'#3a3a3a';
 var base=jPlate(hex,dark,edge);
 /* jIn 안쪽 0~100 좌표는 시각적으로 정사각 → 원이 찌그러지지 않는다 */
 switch(type){
  case 'j_r1': return base;
  case 'j_r2': return base+jSplit(2,soft);
  case 'j_r3': return base+jSplit(3,soft);
  case 'j_rot': return base+jIn(
     '<circle cx="50" cy="50" r="31" fill="'+shadeHex(hex,dark?0.07:0.035)+'" stroke="'+edge+'" stroke-width="1.4"/>'
    +'<circle cx="50" cy="50" r="31" fill="none" stroke="'+soft+'" stroke-width="0.9"/>'
    +'<line x1="50" y1="24" x2="50" y2="36" stroke="'+dark2+'" stroke-width="2.8" stroke-linecap="round"/>');
  case 'j_sock':     return base+jIn(jBig(socketSVG(recess,edge,dark2),1.35));
  case 'j_sockw':    return base+jIn(jBig(socketSVG(recess,edge,dark2),1.30)+jFlap(hex,dark,edge,soft));

  +'<stop offset="0" stop-color="'+fLight+'"/><stop offset=".5" stop-color="'+hex+'"/><stop offset="1" stop-color="'+shadeHex(hex,dark?-0.10:-0.055)+'"/></linearGradient>'

 var ox=x0+(P.w-OW)/2, oy=y0+(P.h-OH)/2;
 var tw=item.L.reduce(function(a,c){return a+c.w;},0), ax=0;
 item.L.forEach(function(c){
  var cw=OW*c.w/tw, cx=ox+ax; ax+=OW*c.w/tw;
  var R={x:cx,y:oy,w:cw,h:OH};

   var _nc=item.nc&&/^(sock(?!c)|stb)/.test(c.face);

   /* 원형 계열 — 한 열이 원/스타디움 한 덩어리, 안쪽만 분할선 */

   rows.forEach(function(rv,k){
