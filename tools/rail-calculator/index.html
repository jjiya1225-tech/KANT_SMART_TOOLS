<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../../icons/icon.svg"><link rel="apple-touch-icon" href="../../icons/icon-180.png"><title>Rail Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #222;
    line-height: 1.6;
  }

  /* ─── Wrapper ─── */
  .calculator-wrapper {
    max-width: 1600px;
    margin: 0 auto;
    padding: 24px 20px 0;
  }
  .global-header { text-align: center; margin-bottom: 4px; }
  .global-header h1 { font-size: 26px; font-weight: 800; }
  .global-header .subtitle { color: #888; font-size: 13px; margin-top: 2px; }

  /* ─── Tab bar ─── */
  .tab-bar-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 8px;
    position: relative;
  }
  .tab-bar-left {
    display: flex; align-items: center; gap: 4px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    flex-shrink: 1; min-width: 0;
  }
  .tab-bar-right {
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0; margin-left: 12px;
  }

  .tab-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 16px; border: 1.5px solid #ddd; border-bottom: none;
    border-radius: 10px 10px 0 0; background: #f0f0f0;
    font-size: 13px; font-weight: 600; color: #888;
    cursor: pointer; white-space: nowrap; transition: all 0.2s;
  }
  .tab-btn:hover { background: #e8e8e8; }
  .tab-btn.active { background: #fff; color: #222; border-color: #ccc; z-index: 1; }
  .tab-btn .tab-close {
    display: inline-flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; border-radius: 50%; border: none;
    background: transparent; font-size: 14px; color: #aaa;
    cursor: pointer; line-height: 1; padding: 0; transition: all 0.15s;
  }
  .tab-btn .tab-close:hover { background: #ddd; color: #555; }
  .tab-add-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px dashed #ccc; background: transparent;
    font-size: 18px; color: #aaa; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s;
  }
  .tab-add-btn:hover { border-color: #888; color: #555; background: #f0f0f0; }
  .tab-rename-input {
    border: 1.5px solid #2563eb; border-radius: 4px;
    padding: 2px 6px; font-size: 13px; font-weight: 600;
    width: 90px; outline: none; font-family: inherit;
  }

  /* ─── Action buttons (top-right) ─── */
  .action-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 13px; border: 1.5px solid #e0e0e0; border-radius: 8px;
    background: #fff; font-size: 12px; font-weight: 600; color: #777;
    cursor: pointer; white-space: nowrap; transition: all 0.2s;
    position: relative;
  }
  .action-btn:hover { border-color: #999; color: #333; }
  .action-btn.active { background: #222; color: #fff; border-color: #222; }
  .action-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .memo-dot {
    position: absolute; top: 4px; right: 4px;
    width: 6px; height: 6px; background: #2563eb;
    border-radius: 50%; display: none;
  }
  .action-btn.has-memo .memo-dot { display: block; }

  /* ─── Memo dropdown ─── */
  .memo-dropdown {
    display: none;
    position: absolute; top: calc(100% + 4px); right: 0;
    width: 360px; background: #fff; border: 1.5px solid #ddd;
    border-radius: 12px; padding: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1); z-index: 100;
  }
  .memo-dropdown-label { font-size: 12px; font-weight: 700; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .memo-textarea {
    width: 100%; min-height: 100px; border: 1.5px solid #e0e0e0; border-radius: 10px;
    padding: 12px 14px; font-size: 14px; font-family: inherit; resize: vertical;
    outline: none; transition: border-color 0.2s; background: #fff; color: #333;
  }
  .memo-textarea:focus { border-color: #222; }
  .memo-textarea::placeholder { color: #bbb; }

  /* ─── Calculator body ─── */
  .calculator-body {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  /* ─── Column shared ─── */
  .col { padding: 24px 20px; }
  .col-header {
    font-size: 12px; font-weight: 700; color: #aaa;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 16px; padding-bottom: 8px;
    border-bottom: 1px solid #f0f0f0;
  }

  /* ─── Col: Input ─── */
  .col-input { padding: 28px 24px; }
  .section-label { text-align: center; font-weight: 700; font-size: 15px; margin-bottom: 12px; }

  .option-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .option-btn {
    padding: 10px 18px; border-radius: 50px; border: 1.5px solid #ddd;
    background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; color: #555;
  }
  .option-btn:hover { border-color: #aaa; }
  .option-btn.active { background: #222; color: #fff; border-color: #222; }

  .shape-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
  .shape-btn {
    padding: 10px 24px; border-radius: 50px; border: 1.5px solid #ddd;
    background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; color: #555;
  }
  .shape-btn:hover { border-color: #aaa; }
  .shape-btn.active { background: #222; color: #fff; border-color: #222; }

  .input-section { margin-bottom: 20px; }
  .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; justify-content: center; }
  .input-label { font-size: 14px; font-weight: 600; min-width: 90px; text-align: right; }
  .input-wrap { position: relative; }
  .length-input {
    width: 170px; padding: 12px 44px 12px 16px; border: 1.5px solid #ddd;
    border-radius: 10px; font-size: 15px; outline: none;
    transition: border-color 0.2s; text-align: center;
  }
  .length-input:focus { border-color: #222; }
  .length-input::placeholder { color: #bbb; }
  .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #999; font-size: 13px; pointer-events: none; }
  .notes { text-align: center; font-size: 12px; color: #999; margin-top: 4px; line-height: 1.8; }

  .shape-diagram { display: flex; justify-content: center; margin-bottom: 16px; }
  .shape-diagram svg { max-width: 160px; }

  .calc-btn {
    display: block; width: 100%; max-width: 260px; margin: 24px auto 0; padding: 14px;
    background: #222; color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s;
  }
  .calc-btn:hover { background: #444; }

  /* ─── Column empty states ─── */
  .col-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 200px; color: #ddd; text-align: center;
  }
  .col-empty svg { width: 48px; height: 48px; margin-bottom: 10px; opacity: 0.4; }
  .col-empty p { font-size: 13px; font-weight: 500; }

  /* ─── Results content ─── */
  .col-results { display: none; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .results-area-header {
    display: none; text-align: center; padding: 16px 20px 12px;
    border-bottom: 1px solid #f0f0f0;
  }
  .results-header-title { font-size: 11px; color: #aaa; font-weight: 600; margin-bottom: 4px; }
  .selected-info {
    font-size: 13px; color: #666; padding: 6px 14px;
    background: #f5f5f5; border-radius: 8px; display: inline-block;
  }

  /* ─── Result cards ─── */
  .result-card { background: #f8f8f8; border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; }
  .result-card-title { font-size: 12px; color: #888; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .result-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
  .result-item-name { font-size: 14px; font-weight: 500; }
  .result-item-value { font-size: 14px; font-weight: 700; color: #222; }
  .cut-detail { font-size: 12px; color: #777; margin-top: 4px; padding-left: 4px; }

  .cut-list { margin-top: 10px; }
  .cut-group-label { font-size: 12px; font-weight: 700; color: #555; padding: 6px 4px 4px; margin-top: 4px; }
  .cut-group-label:first-child { margin-top: 0; }
  .cut-row { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #fff; border-radius: 8px; margin-bottom: 5px; font-size: 13px; }
  .cut-row-label { font-weight: 600; color: #555; min-width: 28px; flex-shrink: 0; }
  .cut-row-product { font-size: 10px; font-weight: 700; color: #fff; background: #555; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
  .cut-row-product.p1m { background: #2563eb; }
  .cut-row-product.p2m { background: #222; }
  .cut-row-product.p3m { background: #7c3aed; }
  .cut-segments { display: flex; gap: 4px; flex-wrap: wrap; }
  .cut-seg { background: #222; color: #fff; padding: 2px 8px; border-radius: 5px; font-size: 12px; font-weight: 600; }
  .cut-seg.waste { background: #ddd; color: #999; }
  .no-cut-tag { font-size: 10px; color: #059669; font-weight: 600; margin-left: 4px; }
  .error-msg { text-align: center; color: #e74c3c; font-size: 14px; font-weight: 600; margin-top: 20px; }

  .install-diagram { background: #fafafa; border-radius: 12px; padding: 16px 10px; margin-bottom: 10px; overflow: hidden; }
  .install-diagram svg { display: block; margin: 0 auto; max-width: 100%; }
  .diagram-legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #666; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }

  .power-card {
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    border-radius: 12px; padding: 18px 18px; margin-bottom: 10px; color: #fff;
  }
  .power-card .result-card-title { color: #94a3b8; }
  .power-card .result-item-name { color: #cbd5e1; }
  .power-card .result-item-value { color: #fff; }
  .power-recommend {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: rgba(255,255,255,0.08); border-radius: 10px; margin-top: 10px; margin-bottom: 6px;
  }
  .power-icon {
    width: 40px; height: 40px; background: #f59e0b; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .power-icon svg { width: 22px; height: 22px; }
  .power-info { flex: 1; }
  .power-info-capacity { font-size: 18px; font-weight: 800; color: #f59e0b; }
  .power-info-desc { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .power-info-count { font-size: 14px; font-weight: 700; color: #fff; text-align: right; flex-shrink: 0; }
  .power-note { font-size: 11px; color: #64748b; margin-top: 6px; padding-left: 4px; }

  /* ─── Custom scrollbar ─── */
  .col::-webkit-scrollbar { width: 4px; }
  .col::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
  .col::-webkit-scrollbar-thumb:hover { background: #bbb; }

  /* ═══════ DESKTOP: 4-column grid ═══════ */
  @media (min-width: 1024px) {
    html, body { height: 100vh; overflow: hidden; }
    .calculator-wrapper { padding: 20px 24px 0; height: 100vh; display: flex; flex-direction: column; }
    .global-header { margin-bottom: 0; flex-shrink: 0; }
    .tab-bar-wrapper { flex-shrink: 0; }
    .action-bar { flex-shrink: 0; }
    .calculator-body {
      display: grid;
      grid-template-columns: 290px 1fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .col-input {
      overflow: hidden;
      border-right: 1px solid #eee;
      padding: 16px 14px;
    }
    /* ── col-input compact overrides ── */
    .col-input .section-label { font-size: 13px; margin-bottom: 6px; }
    .col-input .option-selector { margin-bottom: 10px; }
    #productSelector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    #productSelector .option-btn { padding: 8px 4px; font-size: 12px; }
    .col-input .shape-selector { margin-bottom: 10px; gap: 6px; }
    .col-input .shape-btn { padding: 8px 16px; font-size: 12px; }
    .col-input .shape-diagram { margin-bottom: 4px; }
    .col-input .shape-diagram svg { max-height: 80px; width: auto; }
    .col-input .input-section { margin-bottom: 8px; }
    .col-input .input-row { margin-bottom: 4px; }
    .col-input .notes { margin-top: 0; font-size: 11px; line-height: 1.5; }
    .col-input .calc-btn { margin-top: 10px; padding: 12px; font-size: 14px; }
    .results-area {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto 1fr;
      height: 100%;
      overflow: hidden;
    }
    .results-area-header {
      grid-column: 1 / -1;
    }
    .results-area .col {
      overflow-y: auto;
      min-height: 0;
      border-left: 1px solid #f0f0f0;
      display: flex;
      flex-direction: column;
    }
    .results-area .col .col-header { flex-shrink: 0; }
    .results-area .col .col-results {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .results-area .col:first-of-type { border-left: none; }
    /* diagram column: SVG scales to fit */
    .col-diagram .install-diagram {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .col-diagram .install-diagram svg {
      flex: 1;
      min-height: 0;
      object-fit: contain;
    }
    .col-diagram .diagram-legend { flex-shrink: 0; }
    .col-diagram .result-card { flex-shrink: 0; }
    .col-empty { min-height: 100%; }
    .mobile-results-title { display: none; }
  }

  /* ═══════ MOBILE: single column ═══════ */
  @media (max-width: 1023px) {
    .calculator-wrapper { padding: 16px 12px 0; max-width: 560px; }
    .calculator-body { display: block; }
    .results-area { display: block; }
    .col-input { padding: 28px 20px 20px; }
    .col { padding: 0 20px 20px; }
    .col-header { display: none; }
    .col-empty { display: none !important; }
    .results-area-header { padding: 20px 20px 12px; }
    .tab-bar-right .action-label { display: none; }
    .action-btn { padding: 8px 10px; }
    .memo-dropdown { width: calc(100vw - 40px); right: -8px; }
    .mobile-results-title {
      font-size: 18px; font-weight: 800; text-align: center;
      padding: 24px 20px 0; border-top: 1px solid #eee;
    }
  }
</style>
</head>
<body>

<div class="calculator-wrapper" id="calculatorRoot">
  <div class="global-header">
    <h1>Rail Calculator</h1>
    <p class="subtitle">설치 길이를 입력하면 필요한 레일 조합을 자동으로 계산해 드립니다.</p>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar-wrap">
    <div class="tab-bar-left" id="tabBar"></div>
    <div class="tab-bar-right">
      <button class="action-btn" id="memoToggleBtn" onclick="toggleMemo(event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span class="action-label">메모</span>
        <span class="memo-dot"></span>
      </button>
      <button class="action-btn" onclick="exportImage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span class="action-label">이미지 저장</span>
      </button>
      <button class="action-btn" onclick="exportText()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="action-label">텍스트 내보내기</span>
      </button>
    </div>
    <!-- Memo dropdown -->
    <div class="memo-dropdown" id="memoDropdown">
      <div class="memo-dropdown-label">메모</div>
      <textarea class="memo-textarea" id="memoArea" placeholder="시공 관련 메모를 자유롭게 작성하세요..."></textarea>
    </div>
  </div>

  <!-- Calculator body: 4-column grid on desktop -->
  <div class="calculator-body">
    <!-- Col 1: Input -->
    <div class="col col-input" id="colInput">
      <div class="section-label">제품 선택</div>
      <div class="option-selector" id="productSelector">
        <button class="option-btn active" data-product="5mm" onclick="selectProduct('5mm')">5mm Magnetic</button>
        <button class="option-btn" data-product="15mm" onclick="selectProduct('15mm')">15mm Magnetic</button>
        <button class="option-btn" data-product="17mm" onclick="selectProduct('17mm')">17mm Magnetic</button>
        <button class="option-btn" data-product="28mm" onclick="selectProduct('28mm')">28mm Magnetic</button>
      </div>

      <div class="section-label">설치 위치</div>
      <div class="option-selector" id="locationSelector">
        <button class="option-btn active" data-location="천장-천장" onclick="selectLocation('천장-천장')">천장-천장</button>
        <button class="option-btn" data-location="천장-벽면" onclick="selectLocation('천장-벽면')">천장-벽면</button>
      </div>

      <div class="section-label">설치 형상</div>
      <div class="shape-selector">
        <button class="shape-btn active" data-shape="straight" onclick="selectShape('straight')">일(ㅡ)자</button>
        <button class="shape-btn" data-shape="l-shape" onclick="selectShape('l-shape')">ㄱ자</button>
        <button class="shape-btn" data-shape="square" onclick="selectShape('square')">ㅁ자</button>
      </div>

      <div class="shape-diagram" id="shapeDiagram"></div>
      <div class="input-section" id="inputSection"></div>
      <div class="notes" id="notesArea"></div>
      <button class="calc-btn" onclick="calculate()">조합 계산하기</button>
    </div>

    <!-- Results area: 3 columns -->
    <div class="results-area" id="resultsCapture">
      <div class="results-area-header" id="resultsHeader">
        <div class="results-header-title" id="resultsHeaderTitle"></div>
        <span class="selected-info" id="resultsHeaderInfo"></span>
      </div>

      <!-- Col 2: Diagram -->
      <div class="col col-diagram" id="colDiagram">
        <div class="col-header">시공 다이어그램</div>
        <div class="col-empty" id="emptyDiagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <p>다이어그램이 여기 표시됩니다</p>
        </div>
        <div class="col-results" id="resultDiagram"></div>
      </div>

      <!-- Col 3: Rails -->
      <div class="col col-rails" id="colRails">
        <div class="col-header">레일 구매 & 절단</div>
        <div class="col-empty" id="emptyRails">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
          <p>구매 및 절단 계획</p>
        </div>
        <div class="col-results" id="resultRails"></div>
      </div>

      <!-- Col 4: Accessories -->
      <div class="col col-accessories" id="colAccessories">
        <div class="col-header">부속품 & 안정기</div>
        <div class="col-empty" id="emptyAccessories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
          <p>부속품 및 안정기 정보</p>
        </div>
        <div class="col-results" id="resultAccessories"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── Product configuration ───
const CORNER_SIZES = {
  '5mm':  { '천장-천장': 46, '천장-벽면': 52 },
  '15mm': { '천장-천장': 42, '천장-벽면': 42 },
  '17mm': { '천장-천장': 45, '천장-벽면': 45 },
  '28mm': { '천장-천장': 80, '천장-벽면': 80 }
};
const PRODUCT_RAILS = {
  '5mm':  [2000, 1000],
  '15mm': [2000, 1000],
  '17mm': [3000, 2000, 1000],
  '28mm': [3000, 2000, 1000]
};

// ─── Tab state ───
let tabs = [], activeTabId = null, tabIdCounter = 0;

function createTab(name) {
  const id = 'tab_' + (++tabIdCounter);
  tabs.push({
    id, name: name || ('계산 ' + tabIdCounter),
    product: '5mm', location: '천장-천장', shape: 'straight',
    len1: '', len2: '', memo: '', hasResults: false,
    resultDiagram: '', resultRails: '', resultAccessories: '',
    headerTitle: '', headerInfo: ''
  });
  return id;
}

function saveCurrentTabState() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;
  tab.product = currentProduct;
  tab.location = currentLocation;
  tab.shape = currentShape;
  tab.len1 = document.getElementById('len1')?.value || '';
  tab.len2 = document.getElementById('len2')?.value || '';
  tab.memo = document.getElementById('memoArea')?.value || '';
  const rd = document.getElementById('resultDiagram');
  tab.hasResults = rd && rd.style.display !== 'none' && rd.innerHTML !== '';
  tab.resultDiagram = document.getElementById('resultDiagram').innerHTML;
  tab.resultRails = document.getElementById('resultRails').innerHTML;
  tab.resultAccessories = document.getElementById('resultAccessories').innerHTML;
  tab.headerTitle = document.getElementById('resultsHeaderTitle').textContent;
  tab.headerInfo = document.getElementById('resultsHeaderInfo').textContent;
}

function loadTabState(tabId) {
  const tab = tabs.find(t => t.id === tabId);
  if (!tab) return;
  activeTabId = tabId;
  currentProduct = tab.product;
  currentLocation = tab.location;
  currentShape = tab.shape;

  document.querySelectorAll('#productSelector .option-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.product === currentProduct));
  document.querySelectorAll('#locationSelector .option-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.location === currentLocation));
  document.querySelectorAll('.shape-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.shape === currentShape));

  renderInputs(); renderDiagram(); updateNotes();
  if (document.getElementById('len1')) document.getElementById('len1').value = tab.len1;
  if (document.getElementById('len2')) document.getElementById('len2').value = tab.len2;
  document.getElementById('memoArea').value = tab.memo || '';
  updateMemoDot();

  if (tab.hasResults) {
    document.getElementById('resultDiagram').innerHTML = tab.resultDiagram;
    document.getElementById('resultRails').innerHTML = tab.resultRails;
    document.getElementById('resultAccessories').innerHTML = tab.resultAccessories;
    document.getElementById('resultsHeaderTitle').textContent = tab.headerTitle;
    document.getElementById('resultsHeaderInfo').textContent = tab.headerInfo;
    showResultColumns();
  } else {
    hideResultColumns();
  }
  renderTabBar();
}

function switchTab(tabId) {
  if (tabId === activeTabId) return;
  saveCurrentTabState();
  loadTabState(tabId);
}

function addTab() {
  saveCurrentTabState();
  const id = createTab();
  loadTabState(id);
}

function removeTab(tabId, e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  if (tabs.length <= 1) return;
  const idx = tabs.findIndex(t => t.id === tabId);
  tabs.splice(idx, 1);
  if (activeTabId === tabId) {
    loadTabState(tabs[Math.min(idx, tabs.length - 1)].id);
  } else {
    renderTabBar();
  }
}

function startRenameTab(tabId, e) {
  e.stopPropagation();
  const tab = tabs.find(t => t.id === tabId);
  if (!tab) return;
  const tabEl = document.querySelector(`.tab-btn[data-tab="${tabId}"] .tab-name`);
  if (!tabEl) return;
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'tab-rename-input'; input.value = tab.name;
  input.addEventListener('blur', () => finishRename(tabId, input.value));
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
    if (ev.key === 'Escape') { input.value = tab.name; input.blur(); }
  });
  tabEl.replaceWith(input); input.focus(); input.select();
}

function finishRename(tabId, newName) {
  const tab = tabs.find(t => t.id === tabId);
  if (tab && newName.trim()) tab.name = newName.trim();
  renderTabBar();
}

function renderTabBar() {
  const bar = document.getElementById('tabBar');
  let html = '';
  tabs.forEach(tab => {
    const isActive = tab.id === activeTabId;
    html += `<button class="tab-btn ${isActive ? 'active' : ''}" data-tab="${tab.id}" onclick="switchTab('${tab.id}')">
      <span class="tab-name" ondblclick="startRenameTab('${tab.id}', event)">${tab.name}</span>
      ${tabs.length > 1 ? `<span class="tab-close" onclick="removeTab('${tab.id}', event)">&times;</span>` : ''}
    </button>`;
  });
  html += `<button class="tab-add-btn" onclick="addTab()" title="새 계산 추가">+</button>`;
  bar.innerHTML = html;
}

// ─── Memo toggle ───
let memoOpen = false;
function toggleMemo(e) {
  if (e) e.stopPropagation();
  memoOpen = !memoOpen;
  document.getElementById('memoDropdown').style.display = memoOpen ? 'block' : 'none';
  document.getElementById('memoToggleBtn').classList.toggle('active', memoOpen);
  if (memoOpen) document.getElementById('memoArea').focus();
}
function closeMemo() {
  memoOpen = false;
  document.getElementById('memoDropdown').style.display = 'none';
  document.getElementById('memoToggleBtn').classList.remove('active');
}
function updateMemoDot() {
  const btn = document.getElementById('memoToggleBtn');
  const memo = document.getElementById('memoArea').value.trim();
  btn.classList.toggle('has-memo', memo.length > 0);
}
document.addEventListener('click', (e) => {
  if (!memoOpen) return;
  const dropdown = document.getElementById('memoDropdown');
  const btn = document.getElementById('memoToggleBtn');
  if (!dropdown.contains(e.target) && !btn.contains(e.target)) closeMemo();
});
document.getElementById('memoArea').addEventListener('input', updateMemoDot);

// ─── Show / hide result columns ───
function showResultColumns() {
  document.querySelectorAll('.col-empty').forEach(e => e.style.display = 'none');
  document.querySelectorAll('.col-results').forEach(e => e.style.display = 'block');
  document.getElementById('resultsHeader').style.display = '';
}
function hideResultColumns() {
  document.querySelectorAll('.col-empty').forEach(e => e.style.display = '');
  document.querySelectorAll('.col-results').forEach(e => { e.style.display = 'none'; e.innerHTML = ''; });
  document.getElementById('resultsHeader').style.display = 'none';
}

// ─── Segment colors & helpers ───
const SEG_COLORS = ['#2563eb','#dc2626','#059669','#d97706','#7c3aed','#db2777','#0891b2','#65a30d'];

function findSmallestFittingRail(length, railSizes) {
  let best = railSizes[0];
  for (let i = railSizes.length - 1; i >= 0; i--) {
    if (railSizes[i] >= length) { best = railSizes[i]; break; }
  }
  return best;
}

// ─── Installation diagram (SVG) ───
function renderInstallationDiagram(sides, corners, allSegments, cornerSize) {
  const RAIL_THICK = 10, CORNER_BOX = 14, PAD = 60, DIM_GAP = 22, FONT = 11;
  let segColorMap = {}, colorIdx = 0;
  allSegments.forEach(seg => { const k = seg.sideLabel+'_'+seg.length; if (!segColorMap[k]) segColorMap[k] = SEG_COLORS[colorIdx++ % SEG_COLORS.length]; });
  let sideSegments = {};
  sides.forEach(s => { sideSegments[s.label] = []; });
  allSegments.forEach(seg => { if (sideSegments[seg.sideLabel]) sideSegments[seg.sideLabel].push(seg); });
  const maxInput = Math.max(...sides.map(s => s.inputLength));
  const scale = Math.min(380 / maxInput, 0.25);
  let svgParts = [], usedColors = {};

  if (currentShape === 'straight') {
    const totalW = sides[0].inputLength * scale, svgW = totalW + PAD*2, svgH = 100, y = svgH/2, x0 = PAD;
    let cx = x0;
    const segs = sideSegments[sides[0].label] || allSegments;
    segs.forEach((seg, i) => {
      const w = seg.length * scale, k = seg.sideLabel+'_'+seg.length, color = segColorMap[k];
      usedColors[k] = { color, label: `${seg.sideLabel} ${seg.length}mm` };
      svgParts.push(`<rect x="${cx}" y="${y-RAIL_THICK/2}" width="${w}" height="${RAIL_THICK}" rx="3" fill="${color}"/>`);
      svgParts.push(`<text x="${cx+w/2}" y="${y+RAIL_THICK/2+16}" text-anchor="middle" font-size="${FONT}" font-weight="600" fill="${color}">${seg.length}mm</text>`);
      if (i < segs.length-1) svgParts.push(`<line x1="${cx+w}" y1="${y-8}" x2="${cx+w}" y2="${y+8}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2"/>`);
      cx += w;
    });
    svgParts.push(`<line x1="${x0}" y1="${y-28}" x2="${x0+totalW}" y2="${y-28}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${x0}" y1="${y-32}" x2="${x0}" y2="${y-24}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${x0+totalW}" y1="${y-32}" x2="${x0+totalW}" y2="${y-24}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<text x="${x0+totalW/2}" y="${y-34}" text-anchor="middle" font-size="${FONT}" fill="#888">${sides[0].inputLength}mm</text>`);
    return `<div class="install-diagram"><svg viewBox="0 0 ${svgW} ${svgH}" width="${Math.min(svgW,500)}" xmlns="http://www.w3.org/2000/svg">${svgParts.join('')}</svg>${buildLegend(usedColors,corners,cornerSize)}</div>`;

  } else if (currentShape === 'l-shape') {
    const hLen = sides[0].inputLength*scale, vLen = sides[1].inputLength*scale, cs = CORNER_BOX;
    const svgW = hLen+PAD*2, svgH = vLen+PAD*2, originX = PAD, originY = PAD;
    const cornerY = originY+vLen-cs;
    svgParts.push(`<rect x="${originX}" y="${cornerY}" width="${cs}" height="${cs}" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>`);
    let cy = cornerY;
    (sideSegments[sides[1].label]||[]).forEach((seg,i,arr) => {
      const h = seg.length*scale, k = seg.sideLabel+'_'+seg.length, color = segColorMap[k];
      usedColors[k] = { color, label: `${seg.sideLabel} ${seg.length}mm` };
      svgParts.push(`<rect x="${originX+cs/2-RAIL_THICK/2}" y="${cy-h}" width="${RAIL_THICK}" height="${h}" rx="3" fill="${color}"/>`);
      svgParts.push(`<text x="${originX+cs/2-RAIL_THICK/2-8}" y="${cy-h/2+4}" text-anchor="end" font-size="${FONT}" font-weight="600" fill="${color}">${seg.length}mm</text>`);
      if (i<arr.length-1) svgParts.push(`<line x1="${originX+cs/2-8}" y1="${cy-h}" x2="${originX+cs/2+8}" y2="${cy-h}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2"/>`);
      cy -= h;
    });
    let ccx = originX+cs;
    (sideSegments[sides[0].label]||[]).forEach((seg,i,arr) => {
      const w = seg.length*scale, k = seg.sideLabel+'_'+seg.length, color = segColorMap[k];
      usedColors[k] = { color, label: `${seg.sideLabel} ${seg.length}mm` };
      svgParts.push(`<rect x="${ccx}" y="${cornerY+cs/2-RAIL_THICK/2}" width="${w}" height="${RAIL_THICK}" rx="3" fill="${color}"/>`);
      svgParts.push(`<text x="${ccx+w/2}" y="${cornerY+cs/2+RAIL_THICK/2+16}" text-anchor="middle" font-size="${FONT}" font-weight="600" fill="${color}">${seg.length}mm</text>`);
      if (i<arr.length-1) svgParts.push(`<line x1="${ccx+w}" y1="${cornerY+cs/2-8}" x2="${ccx+w}" y2="${cornerY+cs/2+8}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2"/>`);
      ccx += w;
    });
    const dimY = cornerY+cs+DIM_GAP;
    svgParts.push(`<line x1="${originX}" y1="${dimY}" x2="${originX+hLen}" y2="${dimY}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${originX}" y1="${dimY-4}" x2="${originX}" y2="${dimY+4}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${originX+hLen}" y1="${dimY-4}" x2="${originX+hLen}" y2="${dimY+4}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<text x="${originX+hLen/2}" y="${dimY+16}" text-anchor="middle" font-size="${FONT}" fill="#888">가로 ${sides[0].inputLength}mm</text>`);
    const dimX = originX+cs/2+RAIL_THICK/2+DIM_GAP+30;
    svgParts.push(`<line x1="${dimX}" y1="${originY}" x2="${dimX}" y2="${originY+vLen}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${dimX-4}" y1="${originY}" x2="${dimX+4}" y2="${originY}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${dimX-4}" y1="${originY+vLen}" x2="${dimX+4}" y2="${originY+vLen}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<text x="${dimX+6}" y="${originY+vLen/2+4}" text-anchor="start" font-size="${FONT}" fill="#888" transform="rotate(-90 ${dimX+6} ${originY+vLen/2+4})">세로 ${sides[1].inputLength}mm</text>`);
    return `<div class="install-diagram"><svg viewBox="0 0 ${svgW+40} ${svgH+30}" width="${Math.min(svgW+40,500)}" xmlns="http://www.w3.org/2000/svg">${svgParts.join('')}</svg>${buildLegend(usedColors,corners,cornerSize)}</div>`;

  } else {
    const hLen = sides[0].inputLength*scale, vLen = sides[1].inputLength*scale, cs = CORNER_BOX;
    const svgW = hLen+PAD*2+40, svgH = vLen+PAD*2+30, ox = PAD, oy = PAD;
    [{x:ox,y:oy},{x:ox+hLen-cs,y:oy},{x:ox+hLen-cs,y:oy+vLen-cs},{x:ox,y:oy+vLen-cs}].forEach(cp => {
      svgParts.push(`<rect x="${cp.x}" y="${cp.y}" width="${cs}" height="${cs}" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>`);
    });
    const drawH = (segs, y, labelAbove) => { let cx=ox+cs; segs.forEach(seg=>{ const w=seg.length*scale,k=seg.sideLabel+'_'+seg.length,color=segColorMap[k]; usedColors[k]={color,label:`${seg.sideLabel} ${seg.length}mm`}; svgParts.push(`<rect x="${cx}" y="${y-RAIL_THICK/2}" width="${w}" height="${RAIL_THICK}" rx="3" fill="${color}"/>`); svgParts.push(`<text x="${cx+w/2}" y="${labelAbove?y-RAIL_THICK/2-8:y+RAIL_THICK/2+14}" text-anchor="middle" font-size="${FONT-1}" font-weight="600" fill="${color}">${seg.length}mm</text>`); cx+=w; }); };
    const drawV = (segs, x, labelLeft) => { let cy=oy+cs; segs.forEach(seg=>{ const h=seg.length*scale,k=seg.sideLabel+'_'+seg.length,color=segColorMap[k]; usedColors[k]={color,label:`${seg.sideLabel} ${seg.length}mm`}; svgParts.push(`<rect x="${x-RAIL_THICK/2}" y="${cy}" width="${RAIL_THICK}" height="${h}" rx="3" fill="${color}"/>`); svgParts.push(`<text x="${labelLeft?x-RAIL_THICK/2-8:x+RAIL_THICK/2+8}" y="${cy+h/2+4}" text-anchor="${labelLeft?'end':'start'}" font-size="${FONT-1}" font-weight="600" fill="${color}">${seg.length}mm</text>`); cy+=h; }); };
    drawH(sideSegments['가로①']||[], oy+cs/2, true);
    drawH(sideSegments['가로②']||[], oy+vLen-cs/2, false);
    drawV(sideSegments['세로①']||[], ox+hLen-cs/2, false);
    drawV(sideSegments['세로②']||[], ox+cs/2, true);
    const dtY=oy-DIM_GAP;
    svgParts.push(`<line x1="${ox}" y1="${dtY}" x2="${ox+hLen}" y2="${dtY}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${ox}" y1="${dtY-4}" x2="${ox}" y2="${dtY+4}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${ox+hLen}" y1="${dtY-4}" x2="${ox+hLen}" y2="${dtY+4}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<text x="${ox+hLen/2}" y="${dtY-6}" text-anchor="middle" font-size="${FONT}" fill="#888">가로 ${sides[0].inputLength}mm</text>`);
    const drX=ox+hLen+DIM_GAP+20;
    svgParts.push(`<line x1="${drX}" y1="${oy}" x2="${drX}" y2="${oy+vLen}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${drX-4}" y1="${oy}" x2="${drX+4}" y2="${oy}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<line x1="${drX-4}" y1="${oy+vLen}" x2="${drX+4}" y2="${oy+vLen}" stroke="#bbb" stroke-width="1"/>`);
    svgParts.push(`<text x="${drX+6}" y="${oy+vLen/2+4}" text-anchor="start" font-size="${FONT}" fill="#888" transform="rotate(-90 ${drX+6} ${oy+vLen/2+4})">세로 ${sides[1].inputLength}mm</text>`);
    return `<div class="install-diagram"><svg viewBox="0 0 ${svgW} ${svgH}" width="${Math.min(svgW,500)}" xmlns="http://www.w3.org/2000/svg">${svgParts.join('')}</svg>${buildLegend(usedColors,corners,cornerSize)}</div>`;
  }
}

function buildLegend(usedColors, corners, cornerSize) {
  let items = '';
  Object.values(usedColors).forEach(({color,label}) => { items += `<div class="legend-item"><div class="legend-swatch" style="background:${color}"></div>${label}</div>`; });
  if (corners > 0) items += `<div class="legend-item"><div class="legend-swatch" style="background:#f59e0b;border:1px solid #d97706"></div>연결부속 (${cornerSize}mm)</div>`;
  return `<div class="diagram-legend">${items}</div>`;
}

function renderPowerSupply(totalMeters) {
  let capacity, count = 1, desc;
  if (totalMeters <= 4) { capacity = '100W'; desc = `총 레일 길이 ${totalMeters.toFixed(1)}m (4m 이하)`; }
  else if (totalMeters <= 12) { capacity = '200W'; desc = `총 레일 길이 ${totalMeters.toFixed(1)}m (4~12m)`; }
  else { capacity = '300W'; desc = `총 레일 길이 ${totalMeters.toFixed(1)}m (12m 초과)`; }
  const bolt = `<svg viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`;
  let h = '<div class="power-card"><div class="result-card-title">권장 안정기 (48V)</div>';
  h += `<div class="power-recommend"><div class="power-icon">${bolt}</div><div class="power-info"><div class="power-info-capacity">${capacity}</div><div class="power-info-desc">${desc}</div></div><div class="power-info-count">${count}개</div></div>`;
  h += `<div class="result-item" style="padding-top:8px"><span class="result-item-name">설치 위치</span><span class="result-item-value">레일 전원 입력부 인근</span></div>`;
  h += `<div class="power-note">* 안정기는 레일에서 가장 가까운 은폐 가능한 공간(천장 내부, 가구 뒤 등)에 설치하세요.</div></div>`;
  return h;
}

// ─── Main calculation ───
function calculate() {
  const { v1, v2 } = getInputs();
  const CORNER_SIZE = getCornerSize();
  const railSizes = getRailSizes();
  const largest = railSizes[0];

  if (currentShape === 'straight') {
    if (!v1 || v1 <= 0) return showError('길이를 입력해 주세요.');
  } else {
    if (!v1 || v1 <= 0 || !v2 || v2 <= 0) return showError('가로와 세로 길이를 모두 입력해 주세요.');
  }

  let sides = [], corners = 0;
  if (currentShape === 'straight') {
    sides.push({ label: '레일', inputLength: v1, effectiveLength: v1, group: 'straight' });
  } else if (currentShape === 'l-shape') {
    corners = 1;
    sides.push({ label: '가로', inputLength: v1, effectiveLength: v1 - CORNER_SIZE, group: '가로' });
    sides.push({ label: '세로', inputLength: v2, effectiveLength: v2 - CORNER_SIZE, group: '세로' });
  } else {
    corners = 4;
    sides.push({ label: '가로①', inputLength: v1, effectiveLength: v1 - CORNER_SIZE*2, group: '가로' });
    sides.push({ label: '세로①', inputLength: v2, effectiveLength: v2 - CORNER_SIZE*2, group: '세로' });
    sides.push({ label: '가로②', inputLength: v1, effectiveLength: v1 - CORNER_SIZE*2, group: '가로' });
    sides.push({ label: '세로②', inputLength: v2, effectiveLength: v2 - CORNER_SIZE*2, group: '세로' });
  }

  for (const side of sides) {
    if (side.effectiveLength <= 0) return showError(`${side.label}의 길이가 너무 짧습니다. 연결부속(${CORNER_SIZE}mm) 공간이 확보되지 않습니다.`);
  }

  let allSegments = [], straightConnections = 0;
  for (const side of sides) {
    const eff = side.effectiveLength;
    if (eff <= largest) {
      const chosenRail = findSmallestFittingRail(eff, railSizes);
      allSegments.push({ sideLabel: side.label, group: side.group, length: eff, product: railLabel(chosenRail), productSize: chosenRail, isFullRail: eff === chosenRail });
    } else {
      const fullCount = Math.floor(eff / largest);
      const remainder = eff - (fullCount * largest);
      for (let i = 0; i < fullCount; i++) {
        allSegments.push({ sideLabel: side.label, group: side.group, length: largest, product: railLabel(largest), productSize: largest, isFullRail: true });
      }
      if (remainder > 0) {
        const chosenRail = findSmallestFittingRail(remainder, railSizes);
        allSegments.push({ sideLabel: side.label, group: side.group, length: remainder, product: railLabel(chosenRail), productSize: chosenRail, isFullRail: remainder === chosenRail });
      }
      straightConnections += (fullCount + (remainder > 0 ? 1 : 0)) - 1;
    }
  }

  // Bin packing (separate pools per rail size)
  let bins = [];
  allSegments.filter(s => s.isFullRail).forEach(seg => {
    bins.push({ product: seg.product, productSize: seg.productSize, remaining: 0, segments: [seg], isFullRail: true, group: seg.group });
  });

  const cutBySize = {};
  allSegments.filter(s => !s.isFullRail).forEach(seg => {
    if (!cutBySize[seg.productSize]) cutBySize[seg.productSize] = [];
    cutBySize[seg.productSize].push(seg);
  });

  for (const [sizeStr, segs] of Object.entries(cutBySize)) {
    const size = parseInt(sizeStr);
    const sorted = segs.sort((a, b) => b.length - a.length);
    let sizeBins = [];
    sorted.forEach(seg => {
      let placed = false;
      for (const bin of sizeBins) {
        if (bin.remaining >= seg.length) { bin.segments.push(seg); bin.remaining -= seg.length; placed = true; break; }
      }
      if (!placed) sizeBins.push({ product: railLabel(size), productSize: size, remaining: size - seg.length, segments: [seg], isFullRail: false, group: seg.group });
    });
    bins = bins.concat(sizeBins);
  }

  bins.forEach(bin => {
    const groups = [...new Set(bin.segments.map(s => s.group))];
    bin.group = groups.length === 1 ? groups[0] : 'mixed';
  });

  const groupOrder = { '가로': 0, 'straight': 1, '세로': 2, 'mixed': 3 };
  bins.sort((a, b) => {
    const ga = groupOrder[a.group] ?? 1, gb = groupOrder[b.group] ?? 1;
    if (ga !== gb) return ga - gb;
    if (a.isFullRail !== b.isFullRail) return a.isFullRail ? -1 : 1;
    return 0;
  });

  const count3M = bins.filter(b => b.productSize === 3000).length;
  const count2M = bins.filter(b => b.productSize === 2000).length;
  const count1M = bins.filter(b => b.productSize === 1000).length;

  const cornerConnectors = corners;
  const cornerPowerLines = currentShape === 'square' ? corners - 1 : corners;
  const straightPowerLines = straightConnections;
  const basePowerInput = 1;

  // ═══════ RENDER to 3 columns ═══════
  const productLabel = currentProduct + ' Magnetic';
  const shapeLabel = currentShape === 'straight' ? '일(ㅡ)자' : currentShape === 'l-shape' ? 'ㄱ자' : 'ㅁ자';
  const tabName = tabs.find(t => t.id === activeTabId)?.name || '계산';

  // Header
  document.getElementById('resultsHeaderTitle').textContent = `Rail Calculator — ${tabName}`;
  document.getElementById('resultsHeaderInfo').textContent = `${productLabel} · ${currentLocation} · ${shapeLabel}`;

  // ── Col 2: Diagram ──
  let diagHtml = renderInstallationDiagram(sides, corners, allSegments, CORNER_SIZE);
  diagHtml += '<div class="result-card"><div class="result-card-title">변별 상세</div>';
  sides.forEach(side => { diagHtml += `<div class="result-item"><span class="result-item-name">${side.label}</span><span class="result-item-value">입력 ${side.inputLength}mm → 실제 ${side.effectiveLength}mm</span></div>`; });
  if (corners > 0) diagHtml += `<div class="cut-detail">* 연결부속(${CORNER_SIZE}mm) 공간이 각 변에서 차감됨</div>`;
  diagHtml += '</div>';

  // ── Col 3: Rails ──
  let railsHtml = '<div class="result-card"><div class="result-card-title">레일 구매 목록</div>';
  if (count3M > 0) railsHtml += `<div class="result-item"><span class="result-item-name">3M 레일</span><span class="result-item-value">${count3M}개</span></div>`;
  if (count2M > 0) railsHtml += `<div class="result-item"><span class="result-item-name">2M 레일</span><span class="result-item-value">${count2M}개</span></div>`;
  if (count1M > 0) railsHtml += `<div class="result-item"><span class="result-item-name">1M 레일</span><span class="result-item-value">${count1M}개</span></div>`;
  railsHtml += '</div>';

  railsHtml += '<div class="result-card"><div class="result-card-title">레일 절단 계획</div><div class="cut-list">';
  let prevGroup = null, railNum = 0;
  const groupLabels = { '가로': '가로 레일', '세로': '세로 레일', 'straight': '', 'mixed': '기타' };
  bins.forEach(bin => {
    if (currentShape !== 'straight' && bin.group !== prevGroup) {
      const gl = groupLabels[bin.group] || bin.group;
      if (gl) railsHtml += `<div class="cut-group-label">${gl}</div>`;
      prevGroup = bin.group;
    }
    railNum++;
    const noCut = bin.isFullRail ? '<span class="no-cut-tag">재단 불필요</span>' : '';
    const pClass = railCssClass(bin.productSize);
    railsHtml += `<div class="cut-row"><span class="cut-row-label">${railNum}</span><span class="cut-row-product ${pClass}">${bin.product}</span>`;
    railsHtml += '<div class="cut-segments">';
    bin.segments.forEach(seg => { railsHtml += `<span class="cut-seg">${seg.length}mm (${seg.sideLabel})</span>`; });
    if (bin.remaining > 0) railsHtml += `<span class="cut-seg waste">잔여 ${bin.remaining}mm</span>`;
    railsHtml += `</div>${noCut}</div>`;
  });
  railsHtml += '</div></div>';

  // ── Col 4: Accessories ──
  let accHtml = '<div class="result-card"><div class="result-card-title">부속품 목록</div>';
  if (cornerConnectors > 0) {
    accHtml += `<div class="result-item"><span class="result-item-name">ㄱ자 연결부속 (${currentLocation})</span><span class="result-item-value">${cornerConnectors}개</span></div>`;
    accHtml += `<div class="result-item"><span class="result-item-name">코너 전원연결선</span><span class="result-item-value">${cornerPowerLines}개</span></div>`;
  }
  if (straightPowerLines > 0) accHtml += `<div class="result-item"><span class="result-item-name">일자 전원입력선 (직선 연결용)</span><span class="result-item-value">${straightPowerLines}개</span></div>`;
  accHtml += `<div class="result-item"><span class="result-item-name">전원입력선 (전원 공급용)</span><span class="result-item-value">${basePowerInput}개</span></div>`;
  accHtml += '</div>';

  const totalRailMm = allSegments.reduce((sum, s) => sum + s.length, 0);
  accHtml += renderPowerSupply(totalRailMm / 1000);

  // ── Apply to DOM ──
  document.getElementById('resultDiagram').innerHTML = diagHtml;
  document.getElementById('resultRails').innerHTML = railsHtml;
  document.getElementById('resultAccessories').innerHTML = accHtml;
  showResultColumns();

  // Save to tab
  const tab = tabs.find(t => t.id === activeTabId);
  if (tab) {
    tab.hasResults = true;
    tab.resultDiagram = diagHtml;
    tab.resultRails = railsHtml;
    tab.resultAccessories = accHtml;
    tab.headerTitle = document.getElementById('resultsHeaderTitle').textContent;
    tab.headerInfo = document.getElementById('resultsHeaderInfo').textContent;
  }

  // Mobile: scroll to results
  if (window.innerWidth < 1024) {
    document.getElementById('resultsHeader').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function showError(msg) {
  document.getElementById('resultDiagram').innerHTML = `<div class="error-msg">${msg}</div>`;
  document.getElementById('resultRails').innerHTML = '';
  document.getElementById('resultAccessories').innerHTML = '';
  document.querySelectorAll('.col-empty').forEach(e => e.style.display = 'none');
  document.querySelectorAll('.col-results').forEach(e => e.style.display = 'block');
  document.getElementById('resultsHeader').style.display = 'none';
}

// ─── Export: Image (snapDOM) ───
let snapdomLoaded = false;
function exportImage() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab || !tab.hasResults) return alert('먼저 계산을 실행해 주세요.');
  const target = document.getElementById('resultsCapture');
  if (!snapdomLoaded) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zumer/snapdom@latest/dist/snapdom.min.js';
    s.onload = () => { snapdomLoaded = true; captureImage(target); };
    s.onerror = () => alert('이미지 저장 라이브러리를 불러올 수 없습니다.');
    document.head.appendChild(s);
  } else {
    captureImage(target);
  }
}

async function captureImage(target) {
  const empties = target.querySelectorAll('.col-empty');
  empties.forEach(e => e.style.display = 'none');
  target.style.background = '#ffffff';
  try {
    const result = await snapdom(target, { scale: 2 });
    const tabName = tabs.find(t => t.id === activeTabId)?.name || 'rail-calculator';
    await result.download({ format: 'png', filename: tabName });
  } catch (e) {
    console.error('snapdom error:', e);
    alert('이미지 저장에 실패했습니다.');
  } finally {
    target.style.background = '';
  }
}

// ─── Export: Text ───
function exportText() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab || !tab.hasResults) return alert('먼저 계산을 실행해 주세요.');

  const tabName = tab.name;
  let lines = [`═══ Rail Calculator 결과 (${tabName}) ═══`, `제품: ${currentProduct} Magnetic / 설치 위치: ${currentLocation}`, ''];

  // Gather from all 3 result containers
  ['resultDiagram','resultRails','resultAccessories'].forEach(id => {
    const container = document.getElementById(id);
    container.querySelectorAll('.result-card, .power-card').forEach(card => {
      const title = card.querySelector('.result-card-title');
      if (title) lines.push(`▸ ${title.textContent.trim()}`);

      card.querySelectorAll('.result-item').forEach(item => {
        const name = item.querySelector('.result-item-name')?.textContent.trim() || '';
        const val = item.querySelector('.result-item-value')?.textContent.trim() || '';
        lines.push(`  ${name}: ${val}`);
      });

      const cap = card.querySelector('.power-info-capacity');
      const desc = card.querySelector('.power-info-desc');
      const cnt = card.querySelector('.power-info-count');
      if (cap) lines.push(`  ${cap.textContent.trim()} × ${cnt?.textContent.trim()} — ${desc?.textContent.trim()}`);

      card.querySelectorAll('.cut-group-label').forEach(gl => lines.push(`  [${gl.textContent.trim()}]`));
      card.querySelectorAll('.cut-row').forEach(row => {
        const segs = [...row.querySelectorAll('.cut-seg')].map(s => s.textContent.trim()).join(' + ');
        const prod = row.querySelector('.cut-row-product')?.textContent.trim() || '';
        const noCut = row.querySelector('.no-cut-tag') ? ' (재단 불필요)' : '';
        lines.push(`  ${prod} → ${segs}${noCut}`);
      });

      const detail = card.querySelector('.cut-detail');
      if (detail) lines.push(`  ${detail.textContent.trim()}`);

      const note = card.querySelector('.power-note');
      if (note) lines.push(`  ${note.textContent.trim()}`);

      lines.push('');
    });
  });

  // Append memo
  const memo = document.getElementById('memoArea')?.value?.trim();
  if (memo) { lines.push(`▸ 메모`); lines.push(`  ${memo}`); lines.push(''); }

  const text = lines.join('\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.download = `${tabName}.txt`;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

// ─── Init ───
const firstTabId = createTab('계산 1');
activeTabId = firstTabId;
renderTabBar();
renderInputs();
renderDiagram();
updateNotes();
