<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KANT 발주 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{--navy:#132540;--navy2:#1d3559;--amber:#f4a028;--amber2:#d98a12;--bg:#f4f6fa;--card:#fff;--line:#e2e7ef;--text:#1f2937;--muted:#6b7280;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  header.top{background:var(--navy);color:#fff;padding:13px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
  header.top .logo{font-weight:800;letter-spacing:2px;font-size:20px}
  header.top .logo b{color:var(--amber)}
  header.top .sub{color:#aeb9cc;font-size:12px}
  .wrap{max-width:1280px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{padding:11px 30px;border:1px solid var(--line);background:#fff;border-radius:10px 10px 0 0;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:none;position:relative;top:1px}
  .tab.active{color:var(--navy);border-color:var(--navy)}
  .tab.active::after{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--amber);border-radius:3px 3px 0 0}
  .infobar{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;min-width:140px}
  .field input:focus{outline:none;border-color:var(--navy)}
  .field.grow{flex:1 1 200px}.field.grow input{width:100%}
  .layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
  @media(max-width:980px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .phead{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .phead h2{margin:0;font-size:15px;color:var(--navy)}
  .toolbar{padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;flex-direction:column;gap:8px}
  .toolbar input.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .toolbar input.search:focus{outline:none;border-color:var(--navy)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .catbody{max-height:66vh;overflow:auto}
  .section>.shead{position:sticky;top:0;background:#eef2f8;padding:8px 12px;font-weight:800;color:var(--navy);font-size:13px;border-top:1px solid var(--line);z-index:2}
  .group{border-top:1px solid var(--line)}
  .group>.ghead{padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;color:var(--navy2);background:#fff;font-size:13px}
  .group>.ghead .chev{color:var(--muted);transition:transform .15s;font-size:11px}
  .group.collapsed>.ghead .chev{transform:rotate(-90deg)}
  .group .gcount{margin-left:auto;font-size:11px;color:var(--muted)}
  .group.collapsed .gbody{display:none}
  .prod{border-top:1px solid #eef1f6;padding:9px 12px;display:flex;align-items:center;gap:14px}
  .prod:hover{background:#fcfdff}
  .prod.on{background:#fff8ec}
  .phead2{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
  .phead2 .thumb{width:44px;height:44px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line);object-fit:cover;background:#f2f4f8}
  .phead2 .meta{flex:1 1 auto;min-width:0}
  .pright{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:auto}
  .phead2 .nm{font-weight:600;font-size:13px}
  .phead2 .sp{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selpill{flex:0 0 auto;font-size:11px;font-weight:700;color:#3a2600;background:var(--amber);border-radius:999px;padding:2px 9px}
  .selpill.zero{display:none}
  .qty{display:flex;align-items:center;flex:0 0 auto}
  .qty button{width:28px;height:30px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--navy);font-weight:700}
  .qty button:first-child{border-radius:7px 0 0 7px}.qty button:last-child{border-radius:0 7px 7px 0}
  .qty input{width:48px;height:30px;text-align:center;border:1px solid var(--line);border-left:none;border-right:none;font-size:14px}
  .qty input:focus{outline:none;background:#fff8ec}
  .matrix{margin:0;overflow-x:auto}
  .matrix table{border-collapse:separate;border-spacing:4px}
  .matrix th{font-weight:600;color:#8a93a3;font-size:11px;padding:1px 4px;text-align:center;white-space:nowrap}
  .matrix td{text-align:center}
  .rowlab{display:flex;align-items:center;gap:6px;white-space:nowrap;padding-right:6px;font-size:12px;color:#374151}
  .swatch{width:14px;height:14px;border-radius:50%;border:1px solid #c3cad5;flex:0 0 auto;display:inline-block;vertical-align:middle}
  .mqty{width:54px;height:30px;text-align:center;border:1px solid var(--line);border-radius:7px;font-size:13px;color:#111}
  .mqty:focus{outline:none;border-color:var(--navy);background:#fff8ec}
  .mqty.has{border-color:var(--amber2);background:#fff8ec;font-weight:700}
  .mqty.void{visibility:hidden}
  .tcell{display:flex;flex-direction:column;align-items:center;gap:2px}
  .tcell .tlab{font-size:10px;color:#8a93a3}
  .empty{padding:34px 16px;text-align:center;color:var(--muted)}
  table.pv{width:100%;border-collapse:collapse;font-size:12px}
  table.pv th,table.pv td{padding:7px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  table.pv td.ctr{text-align:center;font-weight:700}
  table.pv img{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
  table.pv input.note{width:100%;padding:3px 5px;border:1px solid var(--line);border-radius:5px;font-size:11px}
  table.pv input.note:focus{outline:none;border-color:var(--navy);background:#fff8ec}
  table.pv input.pqty{width:54px;height:28px;text-align:center;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:700;color:var(--navy)}
  table.pv input.pqty:focus{outline:none;border-color:var(--navy);background:#fff8ec}
  .pvfoot{padding:12px 15px;border-top:1px solid var(--line);background:#fbfcfe}
  .pvfoot .totrow{display:flex;justify-content:space-between;font-weight:700;color:var(--navy);margin-bottom:10px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:14px;color:var(--navy)}
  .btn:hover{background:#f7f9fc}
  .btn.primary{background:var(--amber);border-color:var(--amber2);color:#3a2600}
  .btn.primary:hover{background:var(--amber2);color:#fff}
  .btn.ghost{color:var(--muted)}.btn:disabled{opacity:.5;cursor:not-allowed}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;opacity:0;transition:.25s;z-index:60;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hint{font-size:12px;color:var(--muted);margin:8px 4px 2px}
  .badge{display:inline-block;font-size:10px;color:#6b7280;background:#eef1f6;border-radius:4px;padding:1px 5px;margin-left:4px}
</style>
</head>
<body>
<header class="top"><div class="logo">KANT<b>·</b>발주</div><div class="sub">중국 공장 발주 관리 시스템</div></header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="infobar">
    <div class="field"><label>발주일자</label><input type="date" id="orderDate"></div>
    <div class="field"><label>공급처 (○○ 귀하)</label><input type="text" id="supplier" placeholder="예: 인하이"></div>
    <div class="field"><label>담당자</label><input type="text" id="manager" placeholder="이름"></div>
    <div class="field grow"><label>비고 / 메모</label><input type="text" id="memo" placeholder="배송 요청, 특이사항 등"></div>
  </div>
  <div class="layout">
    <div class="panel">
      <div class="phead"><h2>품목 선택</h2><span class="gcount" id="catInfo"></span></div>
      <div class="toolbar"><input class="search" id="search" placeholder="품목명 검색…"><div class="chips" id="chips"></div><div class="chips" id="colorTabs" style="display:none"></div></div>
      <div class="catbody" id="catalog"></div>
    </div>
    <div class="panel" style="position:sticky;top:70px">
      <div class="phead"><h2>발주 내역</h2><span class="gcount" id="selCount">0 항목</span></div>
      <div id="previewBody" style="max-height:52vh;overflow:auto"></div>
      <div class="pvfoot">
        <div class="totrow"><span id="totQty">총 0개</span></div>
        <div class="actions">
          <button class="btn ghost" id="btnClear">초기화</button>
          <button class="btn" id="btnCopy">표 복사</button>
          <button class="btn primary" id="btnExcel">엑셀 발주서 다운로드</button>
        </div>
      </div>
    </div>
  </div>
  <div class="hint">※ 색상·색온도는 품목 안 표(매트릭스)에서 칸마다 수량을 입력하세요. Tab 키로 칸 이동이 됩니다.</div>
</div>
<div class="toast" id="toast"></div>

const state={factory:Object.keys(CATALOG)[0],catFilter:"all",color:"all",search:"",qty:{},notes:{},gcol:{}};
const COLORS=["블랙","화이트","니켈","오렌지"];
function isMagCat(c){return !!c&&c.indexOf("마그네틱")>=0;}
const $=s=>document.querySelector(s);

let UID=0; const OPTS={};
Object.keys(CATALOG).forEach(fk=>CATALOG[fk].sections.forEach(sec=>sec.groups.forEach(g=>g.products.forEach(p=>{
  p._fk=fk;p._cat=sec.cat;p._group=g.name;p._pid="p"+(++UID);
  p.options.forEach(o=>{o._id="o"+(++UID);o._p=p;OPTS[o._id]=o;});
}))));

function placeholderSVG(t){t=(t||"").slice(0,14);const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' fill='#eef1f6'/><rect x='6' y='6' width='108' height='108' rx='10' fill='#fff' stroke='#d6dbe6'/><circle cx='60' cy='48' r='18' fill='#f4a028' opacity='.85'/></svg>`;return "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));}
function escH(s){return String(s==null?"":s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function imById(im,f){return (im!=null&&im>=0)?IMAGES[im]:placeholderSVG(f);}
function pImg(p){return imById(p.im,p.name);}
function oImg(o){return imById(o.im>=0?o.im:o._p.im,o._p.name);}
function fullName(o){return o.label==="기본"?o._p.name:(o._p.name+" "+o.label);}

const CHEX={"블랙":"#1c1c1e","화이트":"#f3f4f6","니켈":"#b9bec9","오렌지":"#f4a028","크롬":"#cbd0d8","건블랙":"#2b2e34","건크롬":"#7f8590","그레이":"#9aa0a8","실버":"#c4c8d0","골드":"#d9b36a","샌드니켈":"#c9c3b5","올블랙":"#1c1c1e","올화이트":"#f3f4f6","화이트/블랙":"#8a8f99","기본":"#e5e7eb"};
function chex(name){if(!name)return "#e5e7eb";if(CHEX[name])return CHEX[name];const first=name.split("+")[0].trim();return CHEX[first]||"#dfe3ea";}
function swatchHtml(name){if(name&&name.indexOf("+")>=0){const p=name.split("+");return `<span class="swatch" style="background:linear-gradient(135deg,${chex(p[0])} 50%,${chex(p[1])} 50%)"></span>`;}return `<span class="swatch" style="background:${chex(name)}"></span>`;}

function renderTabs(){const t=$("#tabs");t.innerHTML="";Object.keys(CATALOG).forEach(fk=>{const b=document.createElement("div");b.className="tab"+(fk===state.factory?" active":"");b.textContent=CATALOG[fk].label;b.onclick=()=>{state.factory=fk;state.catFilter="all";state.color="all";syncSupplier();render();};t.appendChild(b);});}
function renderChips(){const w=$("#chips");w.innerHTML="";const cats=CATALOG[state.factory].sections.map(s=>s.cat);const mk=(k,l)=>{const c=document.createElement("div");c.className="chip"+(state.catFilter===k?" on":"");c.textContent=l;c.onclick=()=>{state.catFilter=k;state.color="all";render();};return c;};w.appendChild(mk("all","전체"));cats.forEach(c=>w.appendChild(mk(c,c)));}
function renderColorTabs(){const el=$("#colorTabs");if(!el)return;if(!isMagCat(state.catFilter)){el.style.display="none";el.innerHTML="";return;}const sec=CATALOG[state.factory].sections.find(s=>s.cat===state.catFilter);if(!sec){el.style.display="none";return;}const cols=[];sec.groups.forEach(g=>COLORS.forEach(c=>{if(g.name.indexOf(c)>=0&&cols.indexOf(c)<0)cols.push(c);}));if(!cols.length){el.style.display="none";el.innerHTML="";return;}el.style.display="flex";el.innerHTML="";const lab=document.createElement("span");lab.textContent="색상";lab.style.cssText="font-size:11px;color:#9ca3af;align-self:center;margin-right:2px;font-weight:700";el.appendChild(lab);const mk=(k,l)=>{const d=document.createElement("div");d.className="chip"+(state.color===k?" on":"");if(state.color===k){d.style.background="var(--amber)";d.style.borderColor="var(--amber2)";d.style.color="#3a2600";}d.textContent=l;d.onclick=()=>{state.color=k;render();};return d;};el.appendChild(mk("all","전체"));cols.forEach(c=>el.appendChild(mk(c,c)));}

function prodSel(p){return p.options.reduce((a,o)=>a+((state.qty[o._id]||0)>0?1:0),0);}
function dims(p){const colors=[],temps=[];p.options.forEach(o=>{if(o.color&&colors.indexOf(o.color)<0)colors.push(o.color);if(o.temp&&temps.indexOf(o.temp)<0)temps.push(o.temp);});return {colors,temps};}
function optOf(p,color,temp){return p.options.find(o=>(o.color||"")===(color||"")&&(o.temp||"")===(temp||""));}
function cellHtml(o){return o?`<input class="mqty${(state.qty[o._id]||0)>0?' has':''}" data-id="${o._id}" type="number" min="0" value="${state.qty[o._id]||''}" placeholder="0">`:`<input class="mqty void" disabled>`;}
function matrixHtml(p){
  const {colors,temps}=dims(p);
  const cell=cellHtml;
  if(colors.length>1&&temps.length>1){
    let h='<table><tr><th></th>'+temps.map(t=>`<th>${escH(t)}</th>`).join('')+'</tr>';
    colors.forEach(c=>{h+=`<tr><td><div class="rowlab">${swatchHtml(c)}${escH(c)}</div></td>`+temps.map(t=>`<td>${cell(optOf(p,c,t))}</td>`).join('')+'</tr>';});
    return `<div class="matrix">${h}</table></div>`;
  }
  if(temps.length>1){const c=colors[0]||"";return `<div class="matrix"><table><tr>`+temps.map(t=>`<td><div class="tcell"><span class="tlab">${escH(t)}</span>${cell(optOf(p,c,t))}</div></td>`).join('')+`</tr></table></div>`;}
  if(colors.length>1){const t=temps[0]||"";return `<div class="matrix"><table><tr>`+colors.map(c=>`<td><div class="tcell"><span class="tlab">${swatchHtml(c)} ${escH(c)}</span>${cell(optOf(p,c,t))}</div></td>`).join('')+`</tr></table></div>`;}
  return `<div class="matrix"><table><tr>`+p.options.map(o=>`<td><div class="tcell"><span class="tlab">${escH(o.label)}</span>${cell(o)}</div></td>`).join('')+`</tr></table></div>`;
}

function renderCatalog(){
  const box=$("#catalog");box.innerHTML="";
  const fac=CATALOG[state.factory];const q=state.search.trim().toLowerCase();let shown=0;
  fac.sections.forEach(sec=>{
    if(state.catFilter!=="all"&&sec.cat!==state.catFilter)return;
    const magColor=isMagCat(sec.cat)&&state.color!=="all";
    const groupsF=sec.groups.map(g=>({name:g.name,products:g.products.filter(p=>!q||(p.name+" "+p.options.map(o=>o.label).join(" ")).toLowerCase().includes(q))})).filter(g=>g.products.length&&(!magColor||g.name.indexOf(state.color)>=0||!COLORS.some(c=>g.name.indexOf(c)>=0)));
    if(!groupsF.length)return;
    const secEl=document.createElement("div");secEl.className="section";
    const cnt=groupsF.reduce((a,g)=>a+g.products.length,0);
    secEl.innerHTML=`<div class="shead">${escH(sec.cat)} <span class="gcount">· ${cnt}제품</span></div>`;
    groupsF.forEach(g=>{
      const gKey=state.factory+"|"+sec.cat+"|"+g.name;const gclosed=state.gcol[gKey]&&!q;
      const gEl=document.createElement("div");gEl.className="group"+(gclosed?" collapsed":"");
      const gsel=g.products.reduce((a,p)=>a+prodSel(p),0);
      gEl.innerHTML=`<div class="ghead"><span class="chev">▾</span><span>${escH(g.name)}</span><span class="gcount">${gsel?gsel+" 선택 · ":""}${g.products.length}</span></div><div class="gbody"></div>`;
      gEl.querySelector(".ghead").onclick=()=>{state.gcol[gKey]=!state.gcol[gKey];renderCatalog();};
      const gb=gEl.querySelector(".gbody");
      g.products.forEach(p=>{
        shown++;const sel=prodSel(p);
        const el=document.createElement("div");el.className="prod"+(sel>0?" on":"");
        const head=`<div class="phead2"><img class="thumb" src="${pImg(p)}"><div class="meta"><div class="nm">${escH(p.name)}</div><div class="sp">${escH(p.spec||"")}${p.page?` <span class="badge">P${p.page}</span>`:""}</div></div></div>`;
        let right;
        if(p.single){const o=p.options[0];right=`<div class="pright"><span class="selpill${(state.qty[o._id]||0)>0?'':' zero'}">담김</span><div class="matrix"><table><tr><td><div class="tcell"><span class="tlab">수량</span>${cellHtml(o)}</div></td></tr></table></div></div>`;}
        else{right=`<div class="pright"><span class="selpill${sel?'':' zero'}">${sel} 선택</span>${matrixHtml(p)}</div>`;}
        el.innerHTML=head+right;wireInputs(el);gb.appendChild(el);
      });
      secEl.appendChild(gEl);
    });
    box.appendChild(secEl);
  });
  if(!shown)box.innerHTML=`<div class="empty">검색 결과가 없습니다.</div>`;
  const tot=fac.sections.reduce((a,s)=>a+s.groups.reduce((b,g)=>b+g.products.length,0),0);
  $("#catInfo").textContent=`${fac.label} · ${tot}제품`;
}
function qtyHtml(id,v){return `<div class="qty" data-id="${id}"><button data-a="m">−</button><input type="number" min="0" value="${v||""}" placeholder="0"><button data-a="p">＋</button></div>`;}
function wireInputs(root){
  root.querySelectorAll(".qty").forEach(q=>{const id=q.dataset.id;const inp=q.querySelector("input");q.querySelector('[data-a="m"]').onclick=()=>setQty(id,(state.qty[id]||0)-1);q.querySelector('[data-a="p"]').onclick=()=>setQty(id,(state.qty[id]||0)+1);inp.onchange=()=>setQty(id,parseInt(inp.value||"0",10));});
  root.querySelectorAll(".mqty").forEach(inp=>{if(inp.disabled)return;inp.onchange=()=>setQtyNoRerender(inp.dataset.id,parseInt(inp.value||"0",10),inp);});
}
function setQty(id,v){v=isNaN(v)?0:Math.max(0,v);if(v===0)delete state.qty[id];else state.qty[id]=v;render();}
function setQtyNoRerender(id,v,inp){v=isNaN(v)?0:Math.max(0,v);if(v===0)delete state.qty[id];else state.qty[id]=v;inp.classList.toggle("has",v>0);const prod=inp.closest(".prod");if(prod){const o=OPTS[id];const sel=prodSel(o._p);const pill=prod.querySelector(".selpill");if(pill){pill.textContent=o._p.single?"담김":(sel+" 선택");pill.classList.toggle("zero",sel===0);}prod.classList.toggle("on",sel>0);}renderPreview();}
function updateTotals(){const sel=selected();$("#selCount").textContent=sel.length+" 항목";$("#totQty").textContent="총 "+sel.reduce((a,s)=>a+s.qty,0)+"개";$("#btnExcel").disabled=!sel.length;$("#btnCopy").disabled=!sel.length;}
/* 발주 내역(오른쪽)에서 수량 수정 → 왼쪽 카탈로그 칸도 동기화 */
function setQtyFromPreview(id,v){
  v=isNaN(v)?0:Math.max(0,v);const removed=(v===0);if(removed)delete state.qty[id];else state.qty[id]=v;
  const cell=document.querySelector('.mqty[data-id="'+id+'"]');
  if(cell){cell.value=v||'';cell.classList.toggle("has",v>0);const prod=cell.closest(".prod");if(prod){const o=OPTS[id];const sel=prodSel(o._p);const pill=prod.querySelector(".selpill");if(pill){pill.textContent=o._p.single?"담김":(sel+" 선택");pill.classList.toggle("zero",sel===0);}prod.classList.toggle("on",sel>0);}}
  updateTotals();
  if(removed) setTimeout(renderPreview,0);  // 행 제거는 blur 이후로 미뤄 DOM 충돌 방지
}

function selected(){const out=[];Object.keys(state.qty).forEach(id=>{const o=OPTS[id];if(o&&state.qty[id]>0)out.push({o,qty:state.qty[id],note:state.notes[id]||""});});return out;}
function renderPreview(){
  const sel=selected();const body=$("#previewBody");
  $("#selCount").textContent=sel.length+" 항목";$("#totQty").textContent="총 "+sel.reduce((a,s)=>a+s.qty,0)+"개";
  $("#btnExcel").disabled=!sel.length;$("#btnCopy").disabled=!sel.length;
  if(!sel.length){body.innerHTML=`<div class="empty">왼쪽 표에서 수량을 입력하면<br>여기에 발주 내역이 정리됩니다.</div>`;return;}
  let rows="";sel.forEach(s=>{rows+=`<tr><td><img src="${oImg(s.o)}"></td><td><div style="font-weight:600">${escH(fullName(s.o))}</div><div style="font-size:10px;color:#9ca3af">${escH(s.o._p._cat)}</div></td><td class="ctr"><input class="pqty" data-id="${s.o._id}" type="number" min="0" value="${s.qty}"></td><td><input class="note" data-id="${s.o._id}" value="${escH(s.note)}" placeholder="기타"></td></tr>`;});
  body.innerHTML=`<table class="pv"><thead><tr><th style="width:42px">사진</th><th>품목명</th><th style="width:56px">수량</th><th style="width:90px">기타</th></tr></thead><tbody>${rows}</tbody></table>`;
  body.querySelectorAll("input.note").forEach(inp=>inp.onchange=()=>{const id=inp.dataset.id;if(inp.value.trim())state.notes[id]=inp.value;else delete state.notes[id];});
  body.querySelectorAll("input.pqty").forEach(inp=>inp.onchange=()=>setQtyFromPreview(inp.dataset.id,parseInt(inp.value||"0",10)));
}
function render(){renderTabs();renderChips();renderColorTabs();renderCatalog();renderPreview();}

function blankPng(w,h){const c=document.createElement("canvas");c.width=w||160;c.height=h||120;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.strokeStyle="#d6dbe6";g.lineWidth=2;g.strokeRect(3,3,c.width-6,c.height-6);return c.toDataURL("image/png");}
function imgToRaster(src){return new Promise(res=>{if(/^data:image\/(png|jpe?g);/i.test(src)){res(src);return;}const img=new Image();if(/^https?:/i.test(src))img.crossOrigin="anonymous";img.onload=()=>{try{const w=img.naturalWidth||160,h=img.naturalHeight||120;const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/png"));}catch(e){res(blankPng());}};img.onerror=()=>res(blankPng());img.src=src;});}
function rasterParts(u){return {base64:u.split(",")[1],extension:/^data:image\/jpe?g/i.test(u)?"jpeg":"png"};}
async function downloadExcel(){
  const sel=selected();if(!sel.length)return;
  if(typeof ExcelJS==="undefined"){toast("엑셀 모듈 로드 실패 — 인터넷 확인 후 재시도하거나 '표 복사' 이용");return;}
  try{
    const date=$("#orderDate").value||"";const supplier=($("#supplier").value||CATALOG[state.factory].label).trim();const manager=$("#manager").value||"";const memo=$("#memo").value||"";
    const NAVY="FF132540",HEAD="FF1D3559",LINE="FFDDE3EC";const thin={style:"thin",color:{argb:LINE}};const border={top:thin,left:thin,right:thin,bottom:thin};
    const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet("발주서",{views:[{showGridLines:false}],pageSetup:{orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.5,right:0.5,top:0.5,bottom:0.5,header:0.2,footer:0.2}}});
    // 핵심 열: No · 사진 · 품목명 · 수량 · 비고 (규격 제외)
    ws.columns=[{width:5},{width:8},{width:58},{width:9},{width:26}];const NC=5;const setM=(a,b,c,d)=>ws.mergeCells(a,b,c,d);
    setM(1,1,1,NC);const tt=ws.getCell("A1");tt.value="발  주  서";tt.font={name:"맑은 고딕",bold:true,size:20,color:{argb:NAVY}};tt.alignment={horizontal:"center",vertical:"middle"};ws.getRow(1).height=34;
    setM(2,1,2,NC);const info=ws.getCell("A2");info.value=`발주일자: ${date||"-"}    공급처: ${supplier} 귀하    담당자: ${manager||"-"}`;info.font={name:"맑은 고딕",size:11,color:{argb:"FF444444"}};ws.getRow(2).height=20;
    const fill7={type:"pattern",pattern:"solid",fgColor:{argb:"FFF7F9FC"}};
    function infoRow(r,cells){cells.forEach(([c1,c2,v])=>{setM(r,c1,r,c2);const cell=ws.getCell(r,c1);cell.value=v;cell.font={name:"맑은 고딕",size:10};cell.alignment={horizontal:"left",vertical:"middle"};});for(let c=1;c<=NC;c++){const cell=ws.getCell(r,c);cell.border=border;cell.fill=fill7;}ws.getRow(r).height=19;}
    let r=3;
    infoRow(r++,[[1,2,`상호: ${ISSUER.title}`],[3,5,`대표자: ${ISSUER.ceo}    사업자등록번호: ${ISSUER.bizno}`]]);
    infoRow(r++,[[1,5,`소재지: ${ISSUER.addr}`]]);
    infoRow(r++,[[1,2,`업태: ${ISSUER.biz}`],[3,5,`종목: ${ISSUER.item}    연락처: ${ISSUER.tel}`]]);
    infoRow(r++,[[1,5,`업체: KANT LIGHTING`]]);r++;
    const headRow=r;["No","사진","품목명","수량","비고"].forEach((h,i)=>{const c=ws.getCell(r,i+1);c.value=h;c.font={name:"맑은 고딕",bold:true,size:10,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:HEAD}};c.alignment={horizontal:"center",vertical:"middle"};c.border=border;});ws.getRow(r).height=22;r++;
    const IMG=50;
    for(let i=0;i<sel.length;i++){const s=sel[i];const row=ws.getRow(r);row.height=42;ws.getCell(r,1).value=i+1;ws.getCell(r,3).value=fullName(s.o);ws.getCell(r,4).value=s.qty;ws.getCell(r,5).value=s.note||"";for(let c=1;c<=NC;c++){const cell=ws.getCell(r,c);cell.border=border;cell.alignment={vertical:"middle",horizontal:(c===3||c===5)?"left":"center",wrapText:(c===3||c===5)};cell.font={name:"맑은 고딕",size:9};}const du=await imgToRaster(oImg(s.o));const id=wb.addImage(rasterParts(du));ws.addImage(id,{tl:{col:1.08,row:(r-1)+0.08},ext:{width:IMG,height:IMG}});r++;}
    setM(r,1,r,3);const tl=ws.getCell(r,1);tl.value="합 계 수량";tl.font={name:"맑은 고딕",bold:true,size:10,color:{argb:NAVY}};tl.alignment={horizontal:"right",vertical:"middle"};ws.getCell(r,4).value={formula:`SUM(D${headRow+1}:D${r-1})`};for(let c=1;c<=NC;c++){const cell=ws.getCell(r,c);cell.border=border;cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEEF2F8"}};if(c===4){cell.alignment={horizontal:"center",vertical:"middle"};cell.font={name:"맑은 고딕",bold:true,size:11,color:{argb:NAVY}};}}ws.getRow(r).height=22;r+=2;
    const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`발주서_${supplier}_${(date||"").replace(/-/g,"")||"미지정"}.xlsx`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    const saved=await saveOrder(sel,{date,supplier,manager,memo});
    toast(`${supplier} 발주서 다운로드`+(saved?" + 기록 저장":"")+" 완료");
  }catch(e){console.error(e);toast("엑셀 생성 오류: "+(e.message||e));}
}
/* 발주 기록을 구글 시트(Apps Script)로 저장 */
async function saveOrder(sel,meta){
  if(!SAVE_URL)return false;
  try{
    const payload={date:meta.date,supplier:meta.supplier,manager:meta.manager,memo:meta.memo,factory:CATALOG[state.factory].label,totalQty:sel.reduce((a,s)=>a+s.qty,0),items:sel.map(s=>({name:fullName(s.o),cat:s.o._p._cat,qty:s.qty,note:s.note||""}))};
    await fetch(SAVE_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    return true;
  }catch(e){console.error("save fail",e);return false;}
}
async function copyTable(){const sel=selected();if(!sel.length)return;const head=["No","품목명","수량","기타"];const rows=sel.map((s,i)=>[i+1,fullName(s.o),s.qty,s.note||""]);const html=`<table><tr>${head.map(h=>`<th>${escH(h)}</th>`).join("")}</tr>${rows.map(rw=>`<tr>${rw.map(c=>`<td>${escH(c)}</td>`).join("")}</tr>`).join("")}</table>`;const tsv=[head.join("\t"),...rows.map(rw=>rw.join("\t"))].join("\n");try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([tsv],{type:"text/plain"})})]);toast("표를 복사했습니다");}catch(e){try{await navigator.clipboard.writeText(tsv);toast("표를 복사했습니다");}catch(_){toast("복사 실패");}}}
function clearAll(){if(!Object.keys(state.qty).length)return;if(confirm("입력한 수량을 모두 지울까요?")){state.qty={};state.notes={};render();toast("초기화했습니다");}}
let tT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2200);}
function syncSupplier(){const el=$("#supplier");if(!el)return;const labels=Object.keys(CATALOG).map(k=>CATALOG[k].label);if(!el.value.trim()||labels.includes(el.value.trim()))el.value=CATALOG[state.factory].label;}
(function init(){const d=new Date();$("#orderDate").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");syncSupplier();$("#search").oninput=e=>{state.search=e.target.value;renderCatalog();};$("#btnExcel").onclick=downloadExcel;$("#btnCopy").onclick=copyTable;$("#btnClear").onclick=clearAll;render();})();
</script>
